name: Build HDR Studio
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compilation
        run: ./install.sh
      - name: Image disque
        run: |
          mkdir -p stage
          cp -R "build/HDR Studio Claude.app" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "HDR Studio" -srcfolder stage -ov -format UDZO HDRStudio.dmg
      # Notarisation : a activer avec les secrets d'un compte Apple Developer.
      # - name: Signer et notariser
      #   env:
      #     AC_USERNAME: ${{ secrets.AC_USERNAME }}
      #     AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      #     TEAM_ID: ${{ secrets.TEAM_ID }}
      #   run: |
      #     xcrun notarytool submit HDRStudio.dmg --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$TEAM_ID" --wait
      #     xcrun stapler staple HDRStudio.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: HDRStudio-dmg
          path: HDRStudio.dmg
